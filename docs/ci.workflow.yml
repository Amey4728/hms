name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @hms/shared run build

      - name: Generate Prisma client
        run: pnpm --filter @hms/api exec prisma generate

      - name: Lint
        run: pnpm --filter @hms/api run lint

      - name: Unit tests
        run: pnpm --filter @hms/api run test

      - name: Build API
        run: pnpm --filter @hms/api run build

      - name: Build web
        run: pnpm --filter @hms/web run build
